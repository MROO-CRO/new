<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Идут технические работы</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg-deep: #0a0620; --bg-mid: #150a3a;
    --violet: #7b3ff2; --violet-light: #9d6bff;
    --blue: #3a6bff; --blue-light: #6f9dff;
    --text: #ece7ff; --text-dim: #b9aee0; --danger: #ff4d6d;
  }
  body {
    font-family: "Segoe UI", "Inter", sans-serif;
    background: linear-gradient(160deg, var(--bg-deep) 0%, var(--bg-mid) 100%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    padding: 20px;
  }

  /* Светящиеся пятна на фоне */
  .glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.5;
    z-index: 0;
    animation: float 10s ease-in-out infinite;
    pointer-events: none;
  }
  .glow-1 { width: 400px; height: 400px; background: var(--violet); top: -100px; left: -100px; }
  .glow-2 { width: 350px; height: 350px; background: var(--blue); bottom: -100px; right: -100px; animation-delay: -5s; }
  @keyframes float {
    0%,100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(30px,-30px) scale(1.1); }
  }

  /* Карточка с сообщением */
  .maintenance-box {
    position: relative;
    z-index: 2;
    max-width: 700px;
    width: 100%;
    background: rgba(30, 15, 70, 0.6);
    border: 2px solid rgba(255, 77, 109, 0.4);
    border-radius: 30px;
    padding: 60px 40px;
    text-align: center;
    backdrop-filter: blur(20px);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 
                inset 0 0 60px rgba(123, 63, 242, 0.1),
                0 0 40px rgba(255, 77, 109, 0.1);
    animation: appear 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
  }
  @keyframes appear {
    from { opacity: 0; transform: scale(0.9) translateY(30px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  /* Иконка с пульсацией */
  .maintenance-icon {
    font-size: 5rem;
    display: inline-block;
    margin-bottom: 30px;
    animation: pulse 2.5s ease-in-out infinite;
    filter: drop-shadow(0 0 20px rgba(255, 77, 109, 0.6));
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }

  /* Заголовок с градиентом */
  .maintenance-title {
    font-size: clamp(1.4rem, 4vw, 2rem);
    font-weight: 800;
    line-height: 1.4;
    margin-bottom: 20px;
    background: linear-gradient(90deg, var(--violet-light), var(--danger), var(--blue-light), var(--violet-light));
    background-size: 300% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 4s linear infinite;
  }
  @keyframes shine { to { background-position: 300% center; } }

  /* Основной текст */
  .maintenance-text {
    font-size: clamp(1rem, 2.5vw, 1.15rem);
    color: var(--text-dim);
    line-height: 1.8;
    margin-bottom: 20px;
    animation: appear 0.8s ease 0.3s both;
  }

  /* Полоса загрузки */
  .progress-bar {
    width: 100%;
    height: 6px;
    background: rgba(157, 107, 255, 0.15);
    border-radius: 3px;
    margin-top: 40px;
    overflow: hidden;
    position: relative;
    animation: appear 0.8s ease 0.6s both;
  }
  .progress-bar::after {
    content: "";
    position: absolute;
    top: 0; left: -50%;
    width: 50%;
    height: 100%;
    background: linear-gradient(90deg, transparent, var(--violet-light), var(--blue-light), transparent);
    border-radius: 3px;
    animation: loading 2s ease-in-out infinite;
  }
  @keyframes loading {
    0% { left: -50%; }
    100% { left: 100%; }
  }

  /* Подпись */
  .signature {
    margin-top: 30px;
    font-size: 0.85rem;
    color: var(--text-dim);
    opacity: 0.6;
    letter-spacing: 1px;
    text-transform: uppercase;
    animation: appear 0.8s ease 0.9s both;
  }
</style>
</head>
<body>

  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <div class="maintenance-box">
    <div class="maintenance-icon">⚙️</div>
    
    <h1 class="maintenance-title">
      Дорогие друзья!
    </h1>
    
    <p class="maintenance-text">
      Сайт приостановил работу в связи с загрузкой <br>
      <strong style="color: var(--blue-light);">масштабных обновлений!</strong>
    </p>
    
    <p class="maintenance-text">
      Просим прощения за доставленные неудобства!
    </p>

    <div class="progress-bar"></div>

    <div class="signature">
      МРОО «Центр развития образования»
    </div>
  </div>

</body>
</html>
